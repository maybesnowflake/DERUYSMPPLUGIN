name: DeruyPlugin
version: 1.2.0
main: com.deruy.plugin.DeruyPlugin
api-version: '1.21'
author: Fsixel
softdepend:
- WorldGuard
- LuckPerms
- voicechat
commands:
  lifesteal:
    description: LifeSteal 시스템 관리 (toggle, status, recipe additem)
    usage: /<command> toggle|status|recipe additem <name> <slot> <material>
  withdraw:
    description: 자신의 하트를 아이템으로 인출
    usage: /<command> <개수>
  endereyes:
    description: 엔더의 눈 던지기 금지 여부를 즉시 전환
    usage: /<command> on|off
    permission: deruy.endereyes.admin
  devent:
    description: 등록된 이벤트를 이름으로 시작/종료/조회
    usage: /<command> start|stop|list <name>
  koth:
    description: KOTH 거점점령 이벤트 관리 (다중구역 지원)
    usage: /<command> on|off|start|stop|status|zones|setregion <id> 1|2|removezone
      <id>|time <초>
  superkoth:
    description: SuperKOTH 거점점령 이벤트 관리 (KOTH와 동일작동, 완전 독립)
    usage: /<command> on|off|start|stop|status|zones|setregion <id> 1|2|removezone
      <id>|time <초>
  bingo:
    description: 빙고 이벤트 관리
    usage: /<command> team <player> <team>|start|stop|excludeitem <material>|excludebiome
      <biome>
  bounty:
    description: 바운티 이벤트 관리
    usage: /<command> sides <player:name|group:name> <player:name|group:name>|pair|status|start|stop
  questiontime:
    description: 질문타임 관리
    usage: /<command> start|stop|force|status
  randomevent:
    description: 랜덤 이벤트 관리
    usage: /<command> start|stop|force <이벤트>|status|list
  contract:
    description: 위험 계약 관리
    usage: /<command> list|accept <계약>|status|cancel
  supplydrop:
    description: 일반 서플라이드랍 관리
    usage: /<command> start|stop|force|setregion 1|2
  supersupplydrop:
    description: 슈퍼 서플라이드랍 관리
    usage: /<command> start|stop|force|setregion 1|2
  deruytime:
    description: 서버가 인식하는 현재 현실시간 확인
    usage: /<command>
    permission: deruy.time.view
  combat:
    description: 지정 플레이어에게 수동으로 컴벳태그 부여
    usage: /<command> <player> <초>
    permission: deruy.combat.admin
  autotune:
    description: 투명화 유저 대상 보이스챗 오토튠(피치 다운) 이펙트 온오프
    usage: /autotune on|off|status|pitch <반음>
    permission: deruy.autotune.admin
  killlog:
    description: 투명 상태 킬러 이름을 킬로그에서 노이즈 문자로 표시할지 온오프
    usage: /<command> on|off|status
    permission: deruy.killlog.admin
  pvp:
    description: 역할별 PVP 상태를 시간제한으로 변경
    usage: /<command> <역할 [역할...]|ALL> on|off [시간]
    permission: deruy.pvp.admin
  voucher:
    description: 상품권 아이템 지급 (관리자용)
    usage: /<command> give <player> <1|2> [개수]
    permission: deruy.voucher.admin
  horn:
    description: 소실의 저주가 인첸트된 염소뿔 획득 (허용된 역할만)
    usage: /horn <소리번호 1~8>
    permission: deruy.horn.use
  deruyreload:
    description: config.yml을 재시작 없이 다시 불러옴
    usage: /<command>
    permission: deruy.reload.admin
  heart:
    description: 관리자 하트 조회·설정·추가·차감·부활
    usage: /heart info|set|add|remove|revive <player> [hearts]
    permission: deruy.heart.admin
permissions:
  deruy.lifesteal.admin:
    default: op
  deruy.event.admin:
    default: op
  deruy.koth.admin:
    default: op
  deruy.bingo.admin:
    default: op
  deruy.bounty.admin:
    default: op
  deruy.supplydrop.admin:
    default: op
  deruy.time.view:
    default: true
  deruy.combat.admin:
    default: op
  deruy.autotune.admin:
    default: op
  deruy.killlog.admin:
    default: op
  deruy.pvp.admin:
    default: op
  deruy.voucher.admin:
    default: op
  deruy.horn.use:
    default: true
  deruy.endereyes.admin:
    default: op
  deruy.reload.admin:
    default: op
  deruy.heart.admin:
    default: op
  deruy.event.view:
    default: true
  deruy.bingo.view:
    default: true
  deruy.koth.view:
    default: true
  deruy.bounty.view:
    default: true
  deruy.question.admin:
    default: op
  deruy.question.view:
    default: true
  deruy.randomevent.admin:
    default: op
  deruy.randomevent.view:
    default: true
  deruy.contract.use:
    default: true
  deruy.supplydrop.view:
    default: true
