# ==========================================================
# Deruy Plugin 설정 파일 - 모든 기능이 여기서 설정 가능합니다.
# ==========================================================

lifesteal:
  enabled: true
  zero-heart-ban-message: §c하트를 모두 잃어 서버에서 추방되었습니다.

  # pending #4: 트라이던트 리피터틴을 "컴벳태그 중일 때만" 금지
  trident:
    restrict-only-in-combat: true

  # pending #5: 겉날개 / 엔더상자는 "컴벳태그 중일 때만" 제한
  restrictions:
    elytra-blocked: true
    ender-chest-blocked: true
    ender-pearl-tp-blocked: true
    ender-eyes-blocked: true

  # pending #13: 네더라이트 "장비 제작(스미싱 업그레이드)"만 차단. 기존 장비는 사용 가능.
  recipe-block:
    netherite-upgrade-smithing: false

  # 자연사(낙사/익사/용암/굶주림 등 PVP가 아닌 사망)에도 하트를 깎을지 (3주차부터 true로)
  natural-death-removes-heart: false

  # 하트 최소/최대 제한. min 도달시 밴, max 도달시 그 이상은 못 받고 대신 아이템으로 드롭됨.
  heart-limits:
    min-hearts: 5
    max-hearts: 30

  # 특정 역할이 특정 역할에게 죽으면 하트 손실을 배수 적용 (예: L이 F,N,M 중 아무한테나 죽으면 2배)
  # victim-role/killer-role은 roles 섹션에 등록된 이름과 일치해야 함. 여러 쌍 등록 가능.
  # 역할 하나만 적어도 되고("L"), 쉼표로 여러 개 나열하면("F,N,M") 그 중 하나라도 해당되면 매칭(OR 조건).
  double-loss-pairs:
  - victim-role: l,v
    killer-role: n
    multiplier: 3
  - victim-role: l,v
    killer-role: f,m
    multiplier: 2

  # 커스텀 레시피 전부 여기서 정의. shape는 반드시 3줄, 각 줄 3글자(빈칸은 공백).
  # ingredients의 키(D, E, S 등)는 shape에 쓴 글자와 1:1로 대응.
  # "heart"는 특수 레시피로, 결과 아이템이 자동으로 빨간 염료 아이콘의 소비형 하트 아이템이 됨
  # (우클릭하면 소비되고 하트 1개 지급).
  recipes:
    heart:
      result-material: RED_DYE
      result-name: '&c하트'
      shape:
      - DED
      - EAE
      - DED
      ingredients:
        D: DIAMOND_BLOCK
        E: ANCIENT_DEBRIS
        A: OMINOUS_TRIAL_KEY
    totem:
      result-material: TOTEM_OF_UNDYING
      shape:
      - DED
      - ESE
      - DED
      ingredients:
        D: ANCIENT_DEBRIS
        E: GOLD_BLOCK
        S: ENCHANTED_GOLDEN_APPLE
    mace:
      result-material: MACE
      shape:
      - HNH
      - ' B '
      - ' B '
      ingredients:
        H: HEAVY_CORE
        N: NETHERITE_BLOCK
        B: BREEZE_ROD
    golden_apple:
      result-material: GOLDEN_APPLE
      shape:
      - ' G '
      - GAG
      - ' G '
      ingredients:
        G: GOLD_INGOT
        A: APPLE
    custom_netherite_sword:
      result-material: NETHERITE_SWORD
      result-name: '&5&l네더라이트 검'
      shape:
      - ABA
      - CDC
      - AEA
      ingredients:
        A: SHULKER_SHELL
        B: DRAGON_EGG
        C: ELYTRA
        D: DIAMOND_SWORD
        E: DRAGON_BREATH
    custom_netherite_chestplate:
      result-material: NETHERITE_CHESTPLATE
      result-name: '&5&l네더라이트 흉갑'
      shape:
      - ABC
      - DED
      - FGF
      ingredients:
        A: CRIMSON_FUNGUS
        B: NETHERITE_UPGRADE_SMITHING_TEMPLATE
        C: WARPED_FUNGUS
        D: END_CRYSTAL
        E: DIAMOND_CHESTPLATE
        F: ANCIENT_DEBRIS
        G: NETHER_STAR

# 특정 레시피 결과물의 "서버 전체 동시 존재 개수"를 제한.
# 반드시 문자열로 따옴표 씌워서 입력할 것 (숫자로 두면 "0"과 "00"을 구분 못함).
#   "0"  -> 제작 자체가 불가능 (완전 차단)
#   "00" -> 무제한 (개수 제한 없음)
#   그 외 숫자문자열(예: "3") -> 서버 전체에서 그 개수까지만 제작 가능
# 아이템별 UUID로 추적하며 감지된 파괴·토템 소비 시 개수를 차감합니다.
# 추적 목록 초기화: /lifesteal itemlimit reset <레시피이름>
item-limits:
  totem: '00'
  mace: '00'
  custom_netherite_chestplate: '3'
  custom_netherite_sword: '2'

# 상품권 (상자 아이템). 우클릭 개봉하면 reward-items를 굴려서 즉시 지급.
# reward-items는 서플라이드랍/KOTH와 동일한 형식이며 다음 4가지 전부 지원됨:
#   "DIAMOND:0.5"                     - 바닐라 아이템
#   "HEART:0.5"                       - 하트 아이템
#   "RECIPE:custom_netherite_sword:0.1" - 커스텀 레시피 아이템 (item-limits 걸린 것도 자동 처리)
#   "VOUCHER:2:0.1"                   - 다른 티어 상품권도 보상으로 중첩 가능
voucher:
  open-sound: 'minecraft:item.goat_horn.sound.0'
  open-volume: 1.0
  open-pitch: 1.0
  tier1:
    name: '&a&l교환권 [티어 I]'
    custom-model-data: 1101
    reward-items:
    - DIAMOND
    - DIAMOND
    - DIAMOND_BLOCK:0.3
    - VOUCHER:2:0.03
    - HEART:0.2
    - NETHERITE_INGOT:0.1
  tier2:
    name: '&5&l교환권 [티어 II]'
    custom-model-data: 1102
    reward-items:
    - HEART:1
    - HEART:0.3
    - VOUCHER:1
    - ENCHANTED_GOLDEN_APPLE:0.3
    - ENCHANTED_GOLDEN_APPLE
    - NETHERITE_INGOT:0.7
    - VOUCHER:2:0.05
    - NETHER_STAR:0.1
    - DRAGON_EGG:0.01


# /horn <개수 1~8> - 소실의 저주 인첸트된 염소뿔 지급. allowed-roles 비워두면 전원 허용.
horn:
  allowed-roles:
  - l

combat-tag:
  duration-seconds: 15
  # CHAT: 채팅 알림만 / KILL: 사망 및 하트 차감 / NONE: 처리 없음
  # 서버 종료 중에는 적용되지 않음. KILL은 접속 끊김에도 적용됨.
  logout-penalty: CHAT

heart:
  revive-hearts: 10
  # plugins/DeruyPlugin/logs/hearts-YYYY-MM-DD.tsv (UTC 날짜)
  audit-enabled: true

# 컴벳태그 상태일때 특정 WorldGuard 리전 진입을 막는 기능 (WorldGuard 필요)
combat-zone:
  enabled: true
  protected-regions:
  - spawn
  # 컴벳태그 상태로 구역 근처 접근시 경계를 빨간 유리로 표시 (본인에게만 보임, 실제 블록 안바뀜)
  visualize-enabled: true
  visualize-radius: 8

# 투명화 상태 유저 대상 부가 이펙트 (SimpleVoiceChat 필요, /autotune·/killlog 명령어로 인게임에서 즉시 온오프)
voice-effects:
  # 투명화 중 마이크 음성에 피치 다운시프트("오토튠") 적용 여부
  autotune-enabled: true
  # 몇 반음 낮출지 (음수=다운피치). /autotune pitch <반음> 으로 재시작 없이 즉시 조절 가능.
  # 너무 많이 낮추면(예: -6) 소리가 뭉개져서 알아듣기 힘들어짐. -2~-4 정도가 적당함.
  pitch-semitones: -3.0
  # 투명화 상태로 킬을 냈을 때 킬로그(사망메시지)의 킬러 이름을 하얀 노이즈(§k)로 표시할지 여부
  killlog-obfuscation-enabled: true

# 커스텀 로케이터바 (액션바 기반, 은신/투명 무시하고 항상 표시)
locatorbar:
  enabled: false
  update-interval-ticks: 20
  display-name: Super LocatorBar

# KOTH 거점점령 (다중구역, 선택적 시작 지원)
# reward-items는 서플라이드랍과 동일하게 "아이템명:확률" 형식 (확률 생략시 100%)
koth:
  enabled: true
  required-seconds: 30
  # /koth zones 로 구역 테두리를 빨간유리로 표시할 때 몇 초간 유지할지
  zones-visualize-duration-seconds: 15
  # 정기 자동실행 (enabled: true면 매일 지정된 시각마다 자동으로 등록된 전체 구역이 시작됨)
  # koth.enabled(마스터 스위치)도 true여야 실제로 작동함.
  schedule:
    enabled: false
    times:
    - "20:00"
  reward-items:
  - VOUCHER:1
  - ENCHANTED_GOLDEN_APPLE:0.2
  - DIAMOND:0.5
  - GOLDEN_APPLE:0.5

# SuperKOTH - 위 KOTH와 완전히 동일하게 작동하지만 완전히 독립된 구역/설정/커맨드(/superkoth)로 관리됨
superkoth:
  enabled: false
  required-seconds: 60
  zones-visualize-duration-seconds: 15
  schedule:
    enabled: false
    times:
    - "22:00"
  reward-items:
  - NETHERITE_BLOCK:0.5
  - VOUCHER:2
  - ENCHANTED_GOLDEN_APPLE

# 빙고 이벤트 (완성시 승리팀 소속 전원에게 reward-items 지급)
bingo:
  size: 5
  # 여러 줄수를 동시에 목표로 설정 가능. 각 줄수 달성마다 방송+보상, 마지막 값이 "최종 목표".
  line-milestones:
  - 3
  # 최종 목표(line-milestones의 가장 큰 값) 달성시 이벤트를 자동종료할지 여부
  end-on-bingo: true
  excluded-biomes: []
  excluded-items: []
  reward-items:
  - VOUCHER:2
  - VOUCHER:2:0.3
  - VOUCHER:1
  - VOUCHER:1
  - VOUCHER:1
  - TOTEM_OF_UNDYING

# 일반 서플라이드랍 (매일 지정 시간대 안에서 아무도 모르는 랜덤시각 자동실행)
# 트리거되면 상자 1개가 아니라 duration-minutes 동안 count-min~count-max 개가 흩뿌려짐
# reward-items는 "아이템명" 또는 "아이템명:확률" 형식. 확률 생략시 100%로 취급.
# 예: "DIAMOND:0.1" = 그 상자에 10% 확률로 다이아 1개 포함
#
# 스폰 구역: 인게임에서 /supplydrop setregion 1, /supplydrop setregion 2 로
# 두 코너(월드 포함)를 지정하면 그 구역 안에서만 스폰됨 (data.yml에 저장, 재시작해도 유지).
# 구역을 지정 안 하면 아래 center-x/z + radius 방식으로 폴백 (첫번째 월드 기준).
supplydrop:
  # PROTECT: 파괴·폭발 방지 / DROP: 보상을 바닥에 지급하고 데이터 제거
  # 호퍼 입출력은 항상 차단. stop은 이미 생성된 상자는 유지하고 생성 예약을 취소.
  chest-destruction: PROTECT
  normal:
    # true로 하면 서버 켜질 때 자동으로 시작됨 (재시작해도 /supplydrop start 안 쳐도 됨)
    enabled: false
    window-start-hour: 15
    window-end-hour: 24
    # 하루에 몇 번 터질지 (랜덤범위, 기본 1~3)
    triggers-per-day-min: 1
    triggers-per-day-max: 3
    duration-minutes: 15
    count-min: 20
    count-max: 30
    center-x: 1
    center-z: 5
    radius: 104
    reward-items:
    - DIAMOND:0.3
    - GOLDEN_APPLE:0.5
    - VOUCHER:1:0.5
    - VOUCHER:2:0.01
    - EXPERIENCE_BOTTLE:0.3:8

  # 슈퍼 서플라이드랍 (하루 여러개의 "정확한 시간대"를 직접 지정)
  # 트리거되면 duration-minutes 동안 count-min~count-max 개의 고급 상자가 흩뿌려짐
  # 스폰 구역: /supersupplydrop setregion 1, /supersupplydrop setregion 2 로 별도 지정 가능
  super:
    # true로 하면 서버 켜질 때 자동으로 시작됨 (재시작해도 /supersupplydrop start 안 쳐도 됨)
    enabled: false
    windows:
    - 12:45-13:00
    - 16:45-17:00
    - 18:45-19:00
    duration-minutes: 15
    count-min: 7
    count-max: 15
    center-x: 1
    center-z: 5
    radius: 104
    reward-items:
    - VOUCHER:2:0.3
    - VOUCHER:1
    - TOTEM_OF_UNDYING:0.5
    - ENCHANTED_GOLDEN_APPLE:0.3

# 바운티 이벤트
bounty:
  # 바운티 대상이 사망(성공)하면 이벤트 전체를 자동종료할지 여부
  end-on-death: false
  reward-items:
  - VOUCHER:2

# 엔더드래곤 / 드래곤알
dragon:
  health: 2400.0
  egg:
    relocate-on-death: true
    fixed-x: 0
    fixed-y: 65
    fixed-z: 0
    acquire-hold-seconds: 30
    # 드래곤알의 텔레포트 능력 차단 여부. false로 하면 바닐라처럼 다시 순간이동함.
    block-teleport: true

# 토템 작동 여부 (기본 true = 정상 작동)
totem:
  enabled: true
  # 불사의 토템 사용시 기존에 갖고있던 포션이펙트가 사라지지 않게 유지
  keep-effects-on-use: true

# 사망시 포션이팩트 유지 여부
death:
  keep-potion-effects: true
  # 사망시 드롭되는 아이템들이 흩뿌려지는 반경(블록). 0이면 원래처럼 한 곳에 모아 떨어짐.
  drop-scatter-radius: 3.0

# 사망/밴 시점에 재생되는 사운드. sound-name은 Bukkit Sound enum 이름 아무거나 가능
# (마인크래프트에 내장된 소리들, 예: ENTITY_WITHER_SPAWN, ENTITY_ENDER_DRAGON_DEATH 등).
# range: "0"=재생안함(무음), "00"=서버 전체(거리무관 전원에게), 그 외 숫자=그 블록반경 안의 플레이어에게만 들림.
sounds:
  on-death:
    sound-name: ENTITY_WITHER_SPAWN # ✅ 이게 맞는 이름
    pitch: 1.0
    volume: 0.7
    range: '50'
  on-zero-heart-ban:
    sound-name: BLOCK_BEACON_DEACTIVATE
    pitch: 1.0
    volume: 2.0
    range: '00'
  # 하트를 얻거나(킬/아이템소비) 사용(/withdraw 인출)할 때 재생됨
  heart-change:
    sound-name: "BLOCK_RESPAWN_ANCHOR_CHARGE"
    pitch: 1.0
    volume: 1.0
    range: "10"

# 화살이 몸에 박히지 않게
arrow:
  no-stick: true

# 역할(LuckPerms 그룹)별 개별 설정. 여기 등록된 이름이 /pvp 커맨드, role-effects,
# 역할별 하트상한 전부에서 공통으로 쓰임. max-hearts 생략시 전역 heart-limits.max-hearts 사용.
# pvp-allowed 생략시 기본 true(허용).
roles:
  l:
    max-hearts: 13
    pvp-allowed: true
  v:
    max-hearts: 13
    pvp-allowed: true
  f:
    max-hearts: 20
    pvp-allowed: true
  m:
    max-hearts: 17
    pvp-allowed: true
  n:
    max-hearts: 30
    pvp-allowed: true

# 모든 제한 기능에서 출력되는 메시지를 여기서 자유롭게 수정 가능 (& 색상코드 지원)
messages:
  ender-pearl-tp-blocked: '&c엔더진주로 인한 텔레포트가 금지되어 있습니다.'
  elytra-blocked: '&c전투 중에는 겉날개로 활공할 수 없습니다.'
  ender-chest-blocked: '&c전투 중에는 엔더상자를 사용할 수 없습니다.'
  trident-blocked: '&c전투 중에는 삼지창:급류 를 사용할 수 없습니다.'
  netherite-craft-blocked: '&c현재 네더라이트 장비 제작이 금지되어 있습니다.'
  combat-zone-blocked: '&c전투 중에는 이 구역에 들어갈 수 없습니다.'
  dragon-egg-combat-blocked: '&c전투 중에는 드래곤알을 획득할 수 없습니다.'
  dragon-egg-acquiring: '&5드래곤알을 획득하는 중입니다... {seconds}초간 가만히 있으세요.'
  dragon-egg-acquired: '&5&l드래곤알을 획득했습니다!'
  dragon-egg-acquire-cancelled: '&c드래곤알 획득이 중단되었습니다.'
  pvp-blocked: '&c지금은 PVP가 금지되어 있습니다.'
  bounty-target-killed: '&4&l[바운티] &a{killer}님이 타겟 {victim}님을 처치하여 현상금을 획득하셨습니다!'
