name: Build Plugin

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Paper dev classes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/com/deruy/dev
          key: paper-dev-${{ hashFiles('tools/install-paper-dev.sh') }}

      - name: Install Paper dev classes (서버 녹화 컴파일용)
        run: tools/install-paper-dev.sh

      - name: Build
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fsixel
          path: target/*.jar
          if-no-files-found: error
